<!doctype html>
<!-- Quotalis by soybean_alien. Reference only, not rendered: the Editorial direction (paper, magazine-cover numerals),
     kept as inspiration for future Quotalis art alongside the Risograph banner. -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --paper: #f2ede3; --ink: #14141a; --soft: #5b5850; --rule: #14141a;
    --claude: #e8682a; --codex: #1f7ae0; --hermes: #c79400; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .grain { position: absolute; inset: 0; opacity: .22; mix-blend-mode: multiply; }

  .mast { position: absolute; left: 56px; right: 56px; top: 34px; display: flex; justify-content: space-between;
    padding-bottom: 10px; border-bottom: 2px solid var(--rule); font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .22em; }
  .mast2 { position: absolute; left: 56px; right: 56px; top: 64px; border-bottom: 1px solid var(--rule); }

  h1 { position: absolute; left: 46px; top: 58px; font: 400 312px/1 'Instrument Serif', serif; letter-spacing: -.035em; }
  h1 em { font-style: italic; }
  .dek { position: absolute; right: 56px; top: 132px; width: 310px; text-align: right; }
  .dek b { display: block; font: italic 38px/1.05 'Instrument Serif', serif; font-weight: 400; }
  .dek p { margin-top: 14px; font-size: 14px; line-height: 1.5; color: var(--soft); }

  .stats { position: absolute; left: 56px; right: 56px; bottom: 44px; display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 2px solid var(--rule); }
  .stat { padding: 16px 0 0 0; }
  .stat + .stat { border-left: 1px solid var(--rule); padding-left: 26px; }
  .k { font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .22em; display: flex; align-items: center; gap: 10px; }
  .k i { width: 10px; height: 10px; border-radius: 50%; }
  .n { margin-top: 6px; font: 400 104px/0.95 'Instrument Serif', serif; letter-spacing: -.03em; }
  .n small { font: italic 34px 'Instrument Serif', serif; letter-spacing: 0; color: var(--soft); margin-left: 6px; }
</style>
</head>
<body>
  <svg class="grain" width="1280" height="640"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch" /><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .28  0 0 0 0 .24  0 0 0 .55 0" /></filter><rect width="100%" height="100%" filter="url(#n)" /></svg>

  <div class="mast"><span>QUOTALIS · NO. 0.8</span><span>THE LIMITS ISSUE</span><span>FOR WINDOWS</span></div>
  <div class="mast2"></div>

  <h1><em>Q</em>uotalis</h1>
  <div class="dek"><b>Every limit,<br />at a glance.</b><p>Your AI plans, wallets and tokens, folded into one quiet capsule at the top of the screen.</p></div>

  <div class="stats">
    <div class="stat"><div class="k"><i style="background:var(--claude)"></i>CLAUDE · 5-HOUR</div><div class="n" style="color:var(--claude)">68%<small>used</small></div></div>
    <div class="stat"><div class="k"><i style="background:var(--codex)"></i>CODEX · 5-HOUR</div><div class="n" style="color:var(--codex)">31%<small>used</small></div></div>
    <div class="stat"><div class="k"><i style="background:var(--hermes)"></i>HERMES · NOUS WALLET</div><div class="n" style="color:var(--hermes)">$18<small>left</small></div></div>
  </div>
</body>
</html>

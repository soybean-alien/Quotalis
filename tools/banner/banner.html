<!doctype html>
<!-- Quotalis by soybean_alien. Repo banner and social preview in the Risograph design language (overprinted ink circles on
     cream stock, Instrument Serif, JetBrains Mono captions). Rendered by tools/banner/render.ps1 to docs/assets/banner.png
     (2560x1280) and docs/assets/social-preview.png (1280x640). Numbers are sample data. -->
<html>
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root { --paper: #efe7d6; --ink: #1d2040; --soft: #5a5a6e; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--paper); color: var(--ink);
    font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .dot { position: absolute; border-radius: 50%; mix-blend-mode: multiply; }
  .claude { left: 640px; top: 70px; width: 380px; height: 380px; background: #ff7a45; }
  .codex { left: 850px; top: 70px; width: 380px; height: 380px; background: #4f9bff; transform: translate(3px, -2px); }
  .hermes { left: 745px; top: 230px; width: 380px; height: 380px; background: #ffd23a; transform: translate(-2px, 3px); }
  .halftone { position: absolute; left: 600px; top: 40px; width: 680px; height: 600px; mix-blend-mode: multiply; opacity: .22;
    background: radial-gradient(circle, #1d2040 1.1px, transparent 1.4px) 0 0 / 7px 7px;
    -webkit-mask: radial-gradient(closest-side at 70% 55%, #000, transparent); }
  .grain { position: absolute; inset: 0; mix-blend-mode: multiply; opacity: .22; }
  .lbl { position: absolute; font: 500 13px 'JetBrains Mono', monospace; letter-spacing: .24em; color: var(--ink); }

  .copy { position: absolute; left: 64px; top: 72px; width: 560px; }
  .kicker { font: 500 12px 'JetBrains Mono', monospace; letter-spacing: .26em; color: var(--soft); }
  h1 { margin-top: 18px; font: italic 400 150px/0.9 'Instrument Serif', serif; letter-spacing: -.035em; }
  .tag { margin-top: 26px; font: 400 40px/1.08 'Instrument Serif', serif; }
  .sub { margin-top: 22px; font-size: 16px; line-height: 1.55; color: var(--soft); width: 420px; }
  .foot { position: absolute; left: 64px; bottom: 44px; font: 500 11px 'JetBrains Mono', monospace; letter-spacing: .24em; color: var(--soft); }
</style>
</head>
<body>
  <div class="dot claude"></div>
  <div class="dot codex"></div>
  <div class="dot hermes"></div>
  <div class="halftone"></div>
  <span class="lbl" style="left:700px;top:200px">CLAUDE</span>
  <span class="lbl" style="left:1110px;top:200px">CODEX</span>
  <span class="lbl" style="left:900px;top:540px">HERMES</span>
  <span class="lbl" style="left:902px;top:300px;letter-spacing:.3em;color:#efe7d6">YOU</span>

  <div class="copy">
    <div class="kicker">QUOTALIS · FOR WINDOWS</div>
    <h1>Quotalis</h1>
    <div class="tag">Three tools.<br />One quiet capsule.</div>
    <p class="sub">Every limit, wallet and token count where you already look: the top of your screen.</p>
  </div>
  <div class="foot">PRINTED IN THREE INKS · 68% · 31% · $18.42</div>

  <svg class="grain" width="1280" height="640"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch" /><feColorMatrix values="0 0 0 0 .2  0 0 0 0 .18  0 0 0 0 .15  0 0 0 .6 0" /></filter><rect width="100%" height="100%" filter="url(#n)" /></svg>
</body>
</html>

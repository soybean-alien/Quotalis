<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotalis icon concepts</title>
<style>
  :root { --bg:#0f1311; --card:#171c19; --line:#26302a; --text:#e8efe9; --muted:#8fa196; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI Variable","Segoe UI",system-ui,sans-serif; padding:32px 16px; }
  h1 { font-weight:600; font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:20px; max-width:1040px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  .hero { display:flex; justify-content:center; padding:12px 0 18px; }
  .hero svg { width:200px; height:200px; }
  .sizes { display:flex; align-items:end; gap:16px; justify-content:center; padding:12px; border-radius:10px; background:#e9ece9; margin-bottom:14px; }
  .sizes.dark { background:#202020; }
  .sizes svg:nth-child(1){width:64px;height:64px} .sizes svg:nth-child(2){width:32px;height:32px} .sizes svg:nth-child(3){width:16px;height:16px}
  h2 { font-size:16px; font-weight:600; margin:0 0 4px; }
  .card p { margin:0; color:var(--muted); font-size:14px; }
  .n { color:#b6e6c0; font-variant-numeric:tabular-nums; margin-right:6px; }
</style>
</head>
<body>
<h1>Quotalis icon concepts</h1>
<p class="sub">Six original marks, no Claude or OpenAI logos. Each shows the full icon plus 64, 32 and 16 px on a light and dark taskbar.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26302b"/><stop offset="1" stop-color="#101512"/></linearGradient>
    <linearGradient id="tileEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
    <radialGradient id="tileGlow" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#3fbf86" stop-opacity=".28"/><stop offset="1" stop-color="#3fbf86" stop-opacity="0"/></radialGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9fbe3"/><stop offset=".45" stop-color="#7fe0b0"/><stop offset="1" stop-color="#1f9e7a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".34"/><stop offset="1" stop-color="#ffffff" stop-opacity=".08"/></linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7f5"/><stop offset="1" stop-color="#8d9a93"/></linearGradient>
    <linearGradient id="amberBlue" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#ffb35c"/><stop offset=".5" stop-color="#ff7a59"/><stop offset="1" stop-color="#4aa8ff"/></linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c8ffe0"/><stop offset=".5" stop-color="#2fbf7f"/><stop offset="1" stop-color="#0a5a44"/></linearGradient>
    <linearGradient id="alu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f5f4"/><stop offset=".55" stop-color="#b9c1bd"/><stop offset="1" stop-color="#7d8783"/></linearGradient>
    <radialGradient id="aluCap" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#cfd5d2"/><stop offset="1" stop-color="#9aa39f"/></radialGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc0a3"/><stop offset=".5" stop-color="#f07a52"/><stop offset="1" stop-color="#b8442a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9e2ff"/><stop offset=".5" stop-color="#3a9bff"/><stop offset="1" stop-color="#1b4fbf"/></linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>

    <symbol id="base" viewBox="0 0 256 256">
      <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#tile)" filter="url(#drop)"/>
      <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#tileGlow)"/>
      <rect x="13" y="13" width="230" height="230" rx="55" fill="none" stroke="url(#tileEdge)" stroke-width="2"/>
    </symbol>

    <symbol id="i1" viewBox="0 0 256 256">
      <use href="#base"/>
      <circle cx="122" cy="122" r="62" fill="none" stroke="url(#glass)" stroke-width="26"/>
      <circle cx="122" cy="122" r="62" fill="none" stroke="#7fe0b0" stroke-width="26" stroke-linecap="round" stroke-dasharray="290 400" transform="rotate(-90 122 122)" opacity=".55" filter="url(#soft)"/>
      <circle cx="122" cy="122" r="62" fill="none" stroke="url(#mint)" stroke-width="22" stroke-linecap="round" stroke-dasharray="290 400" transform="rotate(-90 122 122)"/>
      <path d="M86 84a62 62 0 0 1 72 -8" fill="none" stroke="url(#spec)" stroke-width="6" stroke-linecap="round" opacity=".8"/>
      <path d="M150 150 L196 196" stroke="url(#needle)" stroke-width="20" stroke-linecap="round"/>
      <circle cx="196" cy="196" r="5" fill="#ffffff" opacity=".7"/>
    </symbol>

    <symbol id="i2" viewBox="0 0 256 256">
      <use href="#base"/>
      <circle cx="122" cy="124" r="70" fill="none" stroke="#3b4a42" stroke-width="20"/>
      <circle cx="122" cy="124" r="70" fill="none" stroke="url(#glass)" stroke-width="20" opacity=".5"/>
      <circle cx="122" cy="124" r="46" fill="none" stroke="#1f8a5e" stroke-width="18"/>
      <circle cx="122" cy="124" r="46" fill="none" stroke="url(#glass)" stroke-width="18" opacity=".55"/>
      <circle cx="122" cy="124" r="24" fill="url(#mint)"/>
      <ellipse cx="114" cy="114" rx="10" ry="6" fill="#fff" opacity=".55"/>
      <rect x="160" y="160" width="46" height="22" rx="11" transform="rotate(45 183 171)" fill="url(#mint)"/>
    </symbol>

    <symbol id="i3" viewBox="0 0 256 256">
      <rect x="12" y="12" width="232" height="232" rx="56" fill="#141816" filter="url(#drop)"/>
      <rect x="13" y="13" width="230" height="230" rx="55" fill="none" stroke="url(#tileEdge)" stroke-width="2"/>
      <circle cx="128" cy="128" r="66" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="18"/>
      <circle cx="128" cy="128" r="66" fill="none" stroke="url(#amberBlue)" stroke-width="22" stroke-linecap="round" stroke-dasharray="300 420" transform="rotate(-90 128 128)" opacity=".6" filter="url(#soft)"/>
      <circle cx="128" cy="128" r="66" fill="none" stroke="url(#amberBlue)" stroke-width="18" stroke-linecap="round" stroke-dasharray="300 420" transform="rotate(-90 128 128)"/>
      <circle cx="62.6" cy="137" r="11" fill="#fff"/>
      <circle cx="62.6" cy="137" r="18" fill="#4aa8ff" opacity=".35" filter="url(#soft)"/>
    </symbol>

    <symbol id="i4" viewBox="0 0 256 256">
      <use href="#base"/>
      <g filter="url(#drop)">
        <polygon points="122,46 176,68 198,122 176,176 122,198 68,176 46,122 68,68" fill="url(#emerald)"/>
        <polygon points="122,82 150,94 162,122 150,150 122,162 94,150 82,122 94,94" fill="#0f1915"/>
        <polygon points="122,46 176,68 150,94 122,82" fill="#fff" opacity=".35"/>
        <polygon points="68,68 122,46 122,82 94,94" fill="#fff" opacity=".55"/>
        <polygon points="46,122 68,68 94,94 82,122" fill="#fff" opacity=".2"/>
        <polygon points="176,176 122,198 122,162 150,150" fill="#000" opacity=".25"/>
        <polygon points="198,122 176,176 150,150 162,122" fill="#000" opacity=".12"/>
        <polygon points="150,150 176,176 212,212 186,212" fill="url(#emerald)"/>
        <polygon points="150,150 176,176 186,212" fill="#fff" opacity=".25"/>
      </g>
    </symbol>

    <symbol id="i5" viewBox="0 0 256 256">
      <use href="#base"/>
      <circle cx="128" cy="128" r="80" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="10"/>
      <circle cx="128" cy="128" r="80" fill="none" stroke="#7fe0b0" stroke-width="10" stroke-linecap="round" stroke-dasharray="352 600" transform="rotate(-90 128 128)" opacity=".7" filter="url(#soft)"/>
      <circle cx="128" cy="128" r="80" fill="none" stroke="url(#mint)" stroke-width="8" stroke-linecap="round" stroke-dasharray="352 600" transform="rotate(-90 128 128)"/>
      <circle cx="128" cy="134" r="60" fill="#000" opacity=".35" filter="url(#soft)"/>
      <circle cx="128" cy="128" r="60" fill="url(#alu)"/>
      <circle cx="128" cy="128" r="50" fill="url(#aluCap)"/>
      <circle cx="128" cy="128" r="50" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.5"/>
      <rect x="124" y="84" width="8" height="24" rx="4" fill="#1f9e7a"/>
    </symbol>

    <symbol id="i6" viewBox="0 0 256 256">
      <use href="#base"/>
      <path d="M122 54 A68 68 0 0 0 66 160" fill="none" stroke="url(#coral)" stroke-width="28" stroke-linecap="round"/>
      <path d="M66 160 A68 68 0 0 0 190 122 A68 68 0 0 0 122 54" fill="none" stroke="url(#blue)" stroke-width="28" stroke-linecap="round"/>
      <path d="M100 66 A56 56 0 0 0 72 112" fill="none" stroke="url(#spec)" stroke-width="6" stroke-linecap="round" opacity=".7"/>
      <path d="M148 150 L194 196" stroke="url(#coral)" stroke-width="26" stroke-linecap="round"/>
      <path d="M150 146 L176 172" stroke="#fff" stroke-opacity=".35" stroke-width="6" stroke-linecap="round"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>

<script>
  const items = [
    ["i1","Gauge Q","A frosted-glass ring that fills like a usage gauge, mint glow, polished needle as the tail. Reads as both Q and meter."],
    ["i2","Layered rings","Three stacked acrylic rings in graphite, forest and mint, from Codex's website palette. Calm and very legible."],
    ["i3","Meter tile","One amber-to-blue progress arc on dark glass, a bright dot at the tip. The most minimal; the colours hint at both services."],
    ["i4","Crystal Q","A faceted emerald gem cut as a Q. Most jewel-like and premium, busiest at 16 px."],
    ["i5","Dial","A brushed-aluminium knob inside a 70% mint arc. Hardware feel, ties in with the Stream Deck dials."],
    ["i6","Twin arcs","Coral and blue ribbons meeting to form the Q. Nods to Claude and Codex without either logo."]
  ];
  const use = id => `<svg viewBox="0 0 256 256"><use href="#${id}"/></svg>`;
  document.getElementById("grid").innerHTML = items.map(([id,name,desc],i) => `
    <div class="card">
      <div class="hero">${use(id)}</div>
      <div class="sizes">${use(id)}${use(id)}${use(id)}</div>
      <div class="sizes dark">${use(id)}${use(id)}${use(id)}</div>
      <h2><span class="n">${i+1}</span>${name}</h2>
      <p>${desc}</p>
    </div>`).join("");
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Quotalis by soybean_alien. The "Gauge Q" app mark; tools/make-icon.ps1 draws the same mark for the .ico. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26302b"/><stop offset="1" stop-color="#101512"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".6"><stop offset="0" stop-color="#3fbf86" stop-opacity=".28"/><stop offset="1" stop-color="#3fbf86" stop-opacity="0"/></radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9fbe3"/><stop offset=".45" stop-color="#7fe0b0"/><stop offset="1" stop-color="#1f9e7a"/></linearGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7f5"/><stop offset="1" stop-color="#8d9a93"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#tile)"/>
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#glow)" stroke="url(#edge)" stroke-width="2"/>
  <circle cx="122" cy="122" r="62" fill="none" stroke="url(#glass)" stroke-width="26"/>
  <path d="M122 60 A62 62 0 1 1 60.04 124.16" fill="none" stroke="#7fe0b0" stroke-width="26" stroke-linecap="round" opacity=".55" filter="url(#blur)"/>
  <path d="M122 60 A62 62 0 1 1 60.04 124.16" fill="none" stroke="url(#mint)" stroke-width="22" stroke-linecap="round"/>
  <path d="M150 150 L196 196" stroke="url(#needle)" stroke-width="20" stroke-linecap="round"/>
  <path d="M86 84 A62 62 0 0 1 158 76" fill="none" stroke="url(#shine)" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <circle cx="196" cy="196" r="5" fill="#fff" opacity=".7"/>
</svg>

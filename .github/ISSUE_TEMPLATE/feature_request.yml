name: Feature request
description: An idea for Developer Island.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation and what is missing today, rather than a finished solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work in the island (compact, live activity, expanded).
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
